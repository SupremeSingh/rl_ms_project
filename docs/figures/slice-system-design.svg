<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<title>SLICE: predicting final answer correctness from an available prefix</title>
<desc>The prediction path passes a question and optional partial answer through a frozen Qwen2.5-Math-1.5B model, a frozen SLICE compressor, and a linear Ridge readout to obtain an eventual-correctness score. A separate offline path uses Math-Verify on completed answers to provide correct or incorrect training labels. First the compressor is learned with a temporary classifier; then it is frozen and Ridge is fitted. Completed answers are not supplied to the prefix predictor.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#34495e"/></marker>
<marker id="trainarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#98641d"/></marker>
</defs>
<rect width="1800" height="1000" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172e43}.title{font-size:36px;font-weight:700}.section{font-size:22px;font-weight:700;letter-spacing:1.4px}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.flow{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#arrow)}.train{fill:none;stroke:#98641d;stroke-width:2.8;stroke-dasharray:9 7;marker-end:url(#trainarrow)}</style>
<text x="70" y="69" class="title" text-anchor="start">SLICE: PREDICTING EVENTUAL ANSWER CORRECTNESS</text>
<text x="70" y="109" class="body" text-anchor="start">FROZEN LLM REPRESENTATIONS → COMPACT FEATURES → LINEAR CORRECTNESS READOUT</text>
<text x="70" y="177" class="section" text-anchor="start">PREDICTION FROM AN AVAILABLE PREFIX</text>
<rect x="70" y="225" width="280" height="175" rx="8" fill="#f8fafc" stroke="#bacad7" stroke-width="1.6"/>
<text x="210.0" y="268" class="head" text-anchor="middle">AVAILABLE PREFIX</text>
<text x="210.0" y="309" class="body" text-anchor="middle">QUESTION + OPTIONAL</text>
<text x="210.0" y="339" class="body" text-anchor="middle">PARTIAL ANSWER</text>
<text x="210.0" y="369" class="body" text-anchor="middle">ONLY TOKENS SEEN SO FAR</text>
<rect x="410" y="225" width="300" height="175" rx="8" fill="#f0f5fa" stroke="#bacad7" stroke-width="1.6"/>
<text x="560.0" y="268" class="head" text-anchor="middle">FROZEN LLM</text>
<text x="560.0" y="309" class="body" text-anchor="middle">QWEN2.5-MATH-1.5B</text>
<text x="560.0" y="339" class="body" text-anchor="middle">READ INTERNAL STATES</text>
<text x="560.0" y="369" class="body" text-anchor="middle">AT THE LAST PREFIX TOKEN</text>
<rect x="770" y="225" width="300" height="175" rx="8" fill="#eaf5f1" stroke="#9ebfae" stroke-width="1.6"/>
<text x="920.0" y="268" class="head" text-anchor="middle">SLICE COMPRESSOR</text>
<text x="920.0" y="309" class="body" text-anchor="middle">COMBINE SELECTED LAYERS</text>
<text x="920.0" y="339" class="body" text-anchor="middle">768 LEARNED FEATURES</text>
<text x="920.0" y="369" class="body" text-anchor="middle">FROZEN DURING READOUT</text>
<rect x="1130" y="225" width="250" height="175" rx="8" fill="#f0f5fa" stroke="#bacad7" stroke-width="1.6"/>
<text x="1255.0" y="268" class="head" text-anchor="middle">RIDGE READOUT</text>
<text x="1255.0" y="309" class="body" text-anchor="middle">LINEAR SCORE</text>
<text x="1255.0" y="339" class="body" text-anchor="middle">769 PARAMETERS</text>
<text x="1255.0" y="369" class="body" text-anchor="middle">INCLUDING INTERCEPT</text>
<text x="1585" y="280" class="head" text-anchor="middle">CORRECTNESS</text>
<text x="1585" y="312" class="head" text-anchor="middle">SCORE</text>
<text x="1585" y="354" class="small" text-anchor="middle">WILL THE FINAL ANSWER</text>
<text x="1585" y="381" class="small" text-anchor="middle">PASS VERIFICATION?</text>
<path d="M350 312 H410" class="flow"/>
<path d="M710 312 H770" class="flow"/>
<path d="M1070 312 H1130" class="flow"/>
<path d="M1380 312 H1445" class="flow"/>
<path d="M1620 625 V490 H920 V400" class="train"/>
<path d="M1255 490 V400" class="train"/>
<text x="1360" y="520" class="small" text-anchor="middle" style="fill:#98641d">OFFLINE LABEL SUPERVISION</text>
<text x="70" y="555" class="section" text-anchor="start">TRAINING DATA: COMPLETE THE ANSWER TO OBTAIN ITS LABEL</text>
<rect x="70" y="625" width="400" height="145" rx="8" fill="#fff9ef" stroke="#d6c19c" stroke-width="1.6"/>
<text x="270.0" y="668" class="head" text-anchor="middle">COMPLETED ANSWER</text>
<text x="270.0" y="709" class="body" text-anchor="middle">GENERATED FROM THE FROZEN MODEL</text>
<text x="270.0" y="739" class="body" text-anchor="middle">REFERENCE ANSWER AVAILABLE</text>
<rect x="590" y="625" width="400" height="145" rx="8" fill="#fff9ef" stroke="#d6c19c" stroke-width="1.6"/>
<text x="790.0" y="668" class="head" text-anchor="middle">MATH-VERIFY</text>
<text x="790.0" y="709" class="body" text-anchor="middle">COMPARE FINAL ANSWER</text>
<text x="790.0" y="739" class="body" text-anchor="middle">AGAINST THE REFERENCE</text>
<rect x="1110" y="625" width="620" height="145" rx="8" fill="#fff9ef" stroke="#d6c19c" stroke-width="1.6"/>
<text x="1420.0" y="668" class="head" text-anchor="middle">CORRECT / INCORRECT LABEL</text>
<text x="1420.0" y="709" class="body" text-anchor="middle">ONE FINAL-OUTCOME LABEL PER ANSWER</text>
<text x="1420.0" y="739" class="body" text-anchor="middle">THE SAME LABEL SUPERVISES ITS SAMPLED PREFIXES</text>
<path d="M470 697 H590" class="flow"/>
<path d="M990 697 H1110" class="flow"/>
<text x="70" y="826" class="section" text-anchor="start">OFFLINE FITTING ORDER</text>
<text x="70" y="867" class="body" text-anchor="start">1  LEARN THE COMPRESSOR WITH A TEMPORARY CLASSIFIER AND SPARSITY PENALTY.</text>
<text x="70" y="902" class="body" text-anchor="start">2  DISCARD THAT CLASSIFIER; FREEZE THE COMPRESSOR; FIT THE RIDGE READOUT.</text>
<line x1="70" y1="931" x2="1730" y2="931" stroke="#cbd5df" stroke-width="1"/>
<text x="70" y="968" class="small" text-anchor="start">AT PREDICTION TIME, ONLY THE TOP PATH IS USED. COMPLETED ANSWERS AND REFERENCES PROVIDE TRAINING LABELS ONLY.</text>
</svg>