[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slice-critic"
version = "0.3.0"
description = "Frozen multi-layer features and compact linear value critics"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = ["numpy>=1.24,<3", "torch>=2.6"]

[project.optional-dependencies]
train = ["transformers>=4.51,<6", "datasets>=3,<5", "huggingface-hub>=0.30,<2"]
verifier = ["math-verify==0.9.0", "latex2sympy2_extended==1.11.0", "antlr4-python3-runtime==4.13.2", "sympy==1.14.0", "mpmath==1.3.0"]
dev = ["pytest>=8", "setuptools>=68", "wheel"]

[project.scripts]
slice-critic = "slice_critic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
