[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-rl"
version = "0.2.0"
description = "Small math RL experiments"
requires-python = ">=3.10"
dependencies = ["slice-critic==0.2.0", "datasets", "pyarrow", "huggingface-hub", "PyYAML"]

[project.scripts]
math-rl = "math_rl.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/slice-critic/tests"]
pythonpath = ["src", "packages/slice-critic/src"]
