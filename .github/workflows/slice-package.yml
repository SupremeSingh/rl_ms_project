name: SLICE package acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installed-wheel:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python: '3.10'
            numpy: 'numpy==1.26.4'
          - python: '3.12'
            numpy: 'numpy>=2.4,<3'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'setuptools>=68' wheel
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './packages/slice-critic[train,dev]' '${{ matrix.numpy }}'
      - name: Test installed wheel outside the repository
        run: python scripts/check_slice_release.py --out outputs/slice-release-ci
      - name: Check research adapters and cumulative equations
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: slice-release-python-${{ matrix.python }}
          path: outputs/slice-release-ci/
