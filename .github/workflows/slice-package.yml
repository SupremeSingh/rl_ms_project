name: SLICE package acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'setuptools>=68' wheel
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './packages/slice-critic[train,dev]'
      - name: Test installed wheel outside the repository
        run: python scripts/check_slice_release.py --out outputs/slice-release-ci
      - name: Check research adapters and cumulative equations
        run: python -m pytest -q tests/test_slice_adapter.py tests/test_slice_ppo_smoke.py tests/test_cumulative_lstd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice-release-python-${{ matrix.python }}
          path: outputs/slice-release-ci/
